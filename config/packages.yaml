    - +external-lapack
    - +external-parallelio
    - spec: ^openblas
      when: '%gcc ^lapack'
    - spec: ^intel-oneapi-mkl
      when: '%oneapi ^lapack'
    - spec: ^nvhpc
      when: '%nvhpc ^lapack'
    - spec: ^cray-libsci
      when: '%cce ^lapack'
    prefer:
    - spec: +pnetcdf
      when: +mpi
    - spec: ~pnetcdf
      when: ~mpi
  expat:

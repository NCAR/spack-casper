packages:
  pkg-config:
    externals:
    - spec: pkg-config@0.29.2
      prefix: /usr
    buildable: false
    require:
    - '%gcc'
  lustre:
    externals:
    - spec: lustre@2.15.4.2_cray_42_ga614b9c
      prefix: /usr
    buildable: false
    require:
    - '%gcc'
  openssl:
    externals:
    - spec: openssl@1.1.1l
      prefix: /usr
    buildable: false
    require:
    # Requiring certs=system is necessary to perform builds like rust using
    # external openssl. Also note that I've edited the package to remove the
    # deprecation status of this version. It makes the concretizer wildly
    # unpredictable and fussy! This seems justified as the Spack documentation
    # itself suggests that the trusted thing to do is to use the system version
    - certs=system
    - '%gcc'
  gcc:
    externals:
    - spec: gcc@7.5.0 languages='c,c++,fortran'
      prefix: /usr
      extra_attributes:
        compilers:
          c: /usr/bin/gcc
          cxx: /usr/bin/g++
          fortran: /usr/bin/gfortran
    variants:
    - +piclibs
    - languages=c,c++,fortran,go
    require:
    - '%gcc'
  pkgconfig:
    buildable: false
  glibc:
    require:
    - '%gcc'
  adios2:
    variants:
    - +cuda
    - +hdf5
    - +python
  all:
    compiler:
    - gcc@12.4.0
    - gcc
    - nvhpc
    - oneapi
    providers:
      'mpi:':
      - openmpi
      - impi
      - mvapich2
      'szip:':
      - libszip
      'pkgconfig:':
      - pkg-config
      'lapack:':
      - openblas
      - intel-oneapi-mkl
      - nvhpc
      'blas:':
      - openblas
      - intel-oneapi-mkl
      - nvhpc
      rpc:
      - libtirpc
      'zlib-api:':
      - zlib
      tbb:
      - intel-oneapi-tbb
      libglx:
      - opengl
      - mesa
    permissions:
      read: world
      write: user
    target:
      # This target is lowest-common denominator between Intel and Milans
    - x86_64_v3
    prefer:
      # This should force packages to use the vendor-preferred solution
      # for BLAS and LAPACK without needing to set it on each package
    - spec: ^openblas
      when: '%gcc ^lapack'
    - spec: ^intel-oneapi-mkl
      when: '%oneapi ^lapack'
    - spec: ^nvhpc
      when: '%nvhpc ^lapack'
    - spec: ^openblas
      when: '%gcc ^blas'
    - spec: ^intel-oneapi-mkl
      when: '%oneapi ^blas'
    - spec: ^nvhpc
      when: '%nvhpc ^blas'
    - spec: ^pkg-config
      when: ^pkgconfig
    - spec: ^zlib
      when: ^zlib-api
    - spec: cuda_arch=60,70,80,89,90 ^cuda@12.3.2
      when: ^cuda
    # Without these, these packages will use GCC versions
    # (not yet true for nvhpc/cce, but check when those runtimes are added)
    - spec: ^hdf5 %oneapi
      when: '%oneapi ^hdf5'
    - spec: ^netcdf-c %oneapi
      when: '%oneapi ^netcdf-c'
  antlr:
    require: '%gcc'
  apptainer:
    variants:
    - ~suid
  arpack-ng:
    variants:
    - ~mpi
  attr:
    require:
    - '%gcc'
  autoconf:
    require: '%gcc'
  autoconf-archive:

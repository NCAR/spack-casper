    - +cxx_exceptions
    - +debug_frame
    - +xz
    - +zlib
    - components=setjmp,ptrace,coredump
  libzip:
    prefer:
    - +gnutls
    - '%gcc@12.5.0'
  linaro-forge:
    require:
    - +accept-eula
  llvm-amdgpu:
    require:
    - '%gcc@12.5.0'
  m4:
    prefer:
    - '%gcc@12.5.0'
  mesa:
    require:
    - +llvm
    - '@25:'
    prefer:
    - ^llvm ~clang
  met:
    variants:
    - +graphics
    - +grib2
    - +lidar2nc
    - +modis
    - +python
  metplus:
    variants:
    - +cycloneplotter
    - +makeplots
    - +plotdataplane
    - +series_analysis
  miniconda3:
    externals:
    - spec: miniconda3@4.12.0
      prefix: /glade/u/apps/opt/conda
    buildable: false
  mpc:
    prefer:
    - '%gcc@12.5.0'
  mpfr:
    prefer:
    - '%gcc@12.5.0'
  mpi:
    prefer:
    - openmpi
  mpifileutils:
    variants:
    - +gpfs
    - +lustre
    - +xattr
  musica:
    variants:
    - ~tuvx
  ncarcompilers:
    variants:
    - +hip
  ncl:
    variants:
    - +eemd
    - +gdal
    - +grib
    - +hdf-eos2
    - +hdf-eos5
    - +hdf4
    externals:
    - spec: ncl@6.6.2
      prefix: /glade/u/apps/opt/ncl/6.6.2
    buildable: false
  nco:
    prefer:
    - ^udunits %gcc@12.5.0
    - '%gcc@12.5.0'
  ncurses:
    prefer:
    - '%gcc@12.5.0'
  ncview:
    prefer:
    - ^udunits %gcc@12.5.0
    - '%gcc@12.5.0'
  ncvis:
    require:
    - ^netcdf-c build_system=autotools
    prefer:
    - '%gcc@12.5.0'
  netcdf:
    variants:
    - +dap
    - ~mpi
  netcdf-c:
    variants:
    - ~mpi
    prefer:
    # Would do require, but ncvis barfs
    - build_system=cmake
    - +blosc
    require:
    - +dap
    - +nczarr_zip
  nettle:
    require:
    - ^gmp %gcc@12.5.0
  numactl:
    require:
    - '%gcc@12.5.0'
  nvhpc:
    require:
    - +blas
    - +lapack
    - ~mpi
    prefer:
    - '%gcc@12.5.0'
  nvtop:
    require:
    - support:=amd
  octave:
    variants:
    - +arpack
    - +curl
    - +fftw
    - +fltk
    - +fontconfig
    - +freetype
    - +gl2ps
    - +glpk
    - +gnuplot
    - +hdf5
    - +llvm
    - +magick
    - +opengl
    - +qhull
    - +qrupdate
    - +qscintilla
    - +qt
    - +suitesparse
    - +zlib
  openblas:
    variants:
    - +fortran
    - threads=openmp
  opengl:
    externals:
    - spec: opengl@4.5
      prefix: /usr
    buildable: false
  openmpi:
    require:
    - fabrics=cma,ucx
    - schedulers=tm
    - +gpfs
    - +lustre
    - +internal-pmix
    - ~internal-hwloc
    - +romio
    - romio-filesystem=nfs,gpfs,lustre,ufs
    - +fortran
    - +rocm
    - +rsh
    - amdgpu_target=gfx942
    - spec: ldflags=-ldl
      when: '%aocc'
    prefer:
    # Otherwise concretizer will try to use old versions
    - spec: ^ucx@1.19.0
      when: '@5.0.8'
  openpbs:
    externals:
    - spec: openpbs@2021.1.3
      prefix: /opt/pbs
    buildable: false
  osu-micro-benchmarks:

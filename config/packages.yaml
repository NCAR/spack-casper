packages:
  openssl:
    externals:
    - spec: openssl@1.1.1l
      prefix: /usr
    buildable: false
    require:
    - certs=system
  lustre:
    externals:
    - spec: lustre@2.15.4.2_cray_42_ga614b9c
      prefix: /usr
    buildable: false
  pkg-config:
    externals:
    - spec: pkg-config@0.29.2
      prefix: /usr
    buildable: false
  gcc:
    externals:
    - spec: gcc@7.5.0 languages:='c,c++,fortran'
      prefix: /usr
      extra_attributes:
        compilers:
          c: /usr/bin/gcc
          cxx: /usr/bin/g++
          fortran: /usr/bin/gfortran
    variants:
    - +piclibs
    - languages=c,c++,fortran
    prefer:
    - spec: '%gcc@7.5.0'
      when: '@:12'
    - spec: '%gcc@12.5.0'
      when: '@13:'
  pkgconfig:
    buildable: false
    prefer:
    - pkg-config
  adios2:
    variants:
    - +hdf5
    - +python
    - +rocm
  all:
    permissions:
      read: world
      write: user
    target:
    # This target is lowest-common denominator between Intel and Milans
    - x86_64_v3
    prefer:
    - +pic
    - +rocm
    - '%c,cxx=gcc@12.5.0'
    - amdgpu_target=gfx942
    - spec: ^hdf5 %gcc@12.5.0
      when: '%gcc@12.5.0 ^hdf5'
    - spec: ^udunits %gcc@12.5.0
      when: '%gcc@12.5.0 ^udunits'
    - spec: ^openblas %gcc@12.5.0
      when: '%gcc@12.5.0 ^openblas'
    - spec: ^openblas %gcc@13.4.0
      when: '%gcc@13.4.0 ^openblas'
    - spec: ^openblas %gcc@15.1.0
      when: '%gcc@15.1.0 ^openblas'
  amdblis:
    variants:
    - +aocl_gemm
    - threads=openmp
    require:
    - '%aocc'
  amdlibflame:
    require:
    - '%aocc'
    - '%blas=amdblis'
    variants:
    - threads=openmp
  aocc:
    require:
    - +license-agreed
  aocl-utils:
    require:
    - '%aocc'
  arpack-ng:
    variants:
    - ~mpi
  automake:
    prefer:
    - '%gcc@12.5.0'
  berkeley-db:
    prefer:
    - '%gcc@12.5.0'
  bzip2:
    prefer:
    - '%gcc@12.5.0'
  cairo:
    variants:
    - +X
    - +fc
    - +ft
    - +gobject
    - +pdf
    - +png
    - +svg
    - +zlib
    prefer:
    - '%gcc@12.5.0'
    # Spack uses older version to avoid pixman :(
    - '@1.18:'
  cdo:
    prefer:
    - +curl
    - +netcdf
    - +hdf5
    - +fftw3
    - +libxml2
    - +udunits2
    - '%gcc@12.5.0'
  cmake:
    variants:
    - +ownlibs
    prefer:
    - '%gcc@12.5.0'
  cmor:
    prefer:
    - ^udunits %gcc@12.5.0
    - '%gcc@12.5.0'
  comgr:
    prefer:
    - '%gcc@12.5.0'
  cp2k:
    variants:
    - +elpa
    - +libvori
    - +plumed
    - +spglib
  curl:
    variants:
    - +libidn2
    - +libssh
    - +libssh2
    - +nghttp2
    prefer:
    - tls=openssl
    - '%gcc@12.5.0'
  darshan-runtime:
    variants:
    - +parallel-netcdf
    - scheduler=pbs
    require:
    - spec: ^hdf5+mpi
      when: +hdf5
    prefer:
    - spec: cflags='-std=gnu17 -Wno-error=implicit-function-declaration -Wno-error=int-conversion'
      when: '%gcc@15:'
  darshan-util:
    variants:
    - +bzip2
    prefer:
    - '%gcc@12.5.0'
  diffutils:
    prefer:
    - '%gcc@12.5.0'
  doxygen:
    variants:
    - +graphviz
  eccodes:
    variants:
    - +fortran
    - +png
    - +tools
    - jp2k=jasper
    require:
    - +netcdf
  ecflow:
    require:
    - +pic
    - +ui
    prefer:
    - '%gcc@12.5.0'
  emacs:
    variants:
    - +X
    - +json
    - +treesitter
    prefer:
    - gui=x11
    - '%gcc@12.5.0'
  esmf:
    variants:
    - ~mpi
    - ~xerces
    require:
    - +external-lapack
    - +external-parallelio
    - +netcdf
    - one_of:
      - +pnetcdf +mpi
      - ~pnetcdf ~mpi
  ffmpeg:
    variants:
    - +X
    - +drawtext
    - +libaom
    - +libmp3lame
    - +libopenjpeg
    - +libopus
    - +libsnappy
    - +libspeex
    - +libssh
    - +libvorbis
    - +libvpx
    - +libwebp
    - +libx264
    - +libxml2
    - +libzma
    - +libzmq
    - +sdl2
  fftw:
    variants:
    - ~mpi
  findutils:
    prefer:
    - '%gcc@12.5.0'
  flex:
    prefer:
    - '@2.6.4'
    - '%gcc@12.5.0'
  fmt:
    prefer:
    - '%gcc@12.5.0'
  gawk:
    prefer:
    - '%gcc@12.5.0'
  gdal:
    require:
    - spec: ^hdf5~mpi
      when: +hdf5
    # libcsf, pcidsk, pdfium can't actually be used... why are they variants???
    # Need to specify these as requirements b/c Spack will be lazy and avoid even
    # with prefer
    - +blosc
    - +curl
    - +deflate
    - +expat
    - +geos
    - +gif
    - +hdf5
    - +iconv
    - +jpeg
    - +libaec
    - +liblzma
    - +libxml2
    - +lz4
    - +netcdf
    - +openjpeg
    - +parquet
    - +png
    - +qhull
    - +sqlite3
    - +webp
    - +zstd
    - ~hdf4
  gdb:
    variants:
    - +gold
    - +ld
    - +lto
    - +source-highlight
    - +tui
    - ~debuginfod
    - ~python
    prefer:
    - '%gcc@12.5.0'
  gdbm:
    prefer:
    - '%gcc@12.5.0'
  gettext:
    prefer:
    - +libxml2
    - '%gcc@12.5.0'
  git:
    variants:
    - +svn
    - +tcltk
    prefer:
    - '%gcc@12.5.0'
  gmake:
    variants:
    - ~guile
    require:
    # This may help ioapi build
    - '@:4.2'
    prefer:
    - '%gcc@12.5.0'
  gmp:
    prefer:
    - '%gcc@12.5.0'
  gmt:
    variants:
    - +ffmpeg
    - +fftw
    - +geos
    - +ghostscript
    - +glib
    - +pcre
    require:
    - +blas
    - +lapack
    - spec: '^ffmpeg@7:'
      when: +ffmpeg
    prefer:
    - '%gcc@12.5.0'
  gnuplot:
    variants:
    - +X
    - +wx
    prefer:
    - +qt
    - '%gcc@12.5.0'
  gptl:
    variants:
    - +nestedomp
    - +papi
    - +pmpi
    prefer:
    - spec: cflags='-std=gnu17 -Wno-error=implicit-function-declaration -Wno-error=int-conversion'
      when: '%gcc@15:'
  grads:
    require:
    - +dap
    - +hdf4
  h5z-ftp:
    require:
    - ^hdf5~mpi
  harfbuzz:
    variants:
    - +graphite2
    prefer:
    - '%gcc@12.5.0'
  hdf:
    variants:
    - +fortran
    - +szip
    require:
    - +external-xdr
    prefer:
    - spec: cflags='-std=c90 -Wno-error=int-conversion'
      when: '%gcc@15:'
    - spec: cflags='-std=c90 -Wno-error=int-conversion'
      when: '%intel-oneapi-compilers'
  hdf5:
    variants:
    - +cxx
    - +fortran
    - +hl
    - +map
    - +szip
    - ~mpi
    require:
    - spec: ldflags=-lpthread
      when: +threadsafe @1.14
  hip:
    require:
    - +rocm
    prefer:
    - '%gcc@12.5.0'
  hipcc:
    prefer:
    - '%gcc@12.5.0'
  hwloc:
    require:
    - +rocm
    - '%gcc@12.5.0'
  imagemagick:
    variants:
    - +ghostscript
  intel-oneapi-compilers:
    variants:
    - +amd
    prefer:
    - '%gcc@12.5.0'
  intel-oneapi-mkl:
    require:
    - spec: +gfortran threads=openmp
      when: '%gcc'
  intel-oneapi-mpi:
    variants:
    - +external-libfabric
    - +generic-names
  intel-oneapi-runtime:
    prefer:
    - ^gcc-runtime@12.5.0
  ip:
    prefer:
    - '%lapack=openblas'
  ispc:
    require:
    - '%clang'
  jasper:
    prefer:
    - '@:2'
    - '%gcc@12.5.0'
  kokkos:
    variants:
    - +examples
    - ~openmp
    require:
    - spec: +rocm +wrapper ~alloc_async
      when: '%gcc'
    - spec: +rocm +apu +wrapper ~alloc_async
      when: '%aocc'
    - spec: ^cmake@3.27
      when: '@:4.2.01 +rocm'
  libarchive:
    require:
    - compression=bz2lib,lz4,lzma,lzo2,zlib,zstd xar=expat
  libdrm:
    prefer:
    - '@2.4.124'
    - '%gcc@12.5.0'
  libgeotiff:
    require:
    # Doesn't build without proj as a dependency for me
    - +proj
    prefer:
    - '%gcc@12.5.0'
  libglx:
    prefer:
    - opengl
  libsigsegv:
    prefer:
    - '%gcc@12.5.0'
  libszip:
    prefer:
    - '%gcc@12.5.0'
  libtiff:
    require:
    - build_system=cmake
    - +pic
    prefer:
    - '%gcc@12.5.0'
  libtool:
    prefer:
    - '%gcc@12.5.0'
  libtree:
    prefer:
    - '%gcc@12.5.0'
  libunwind:

      prefix: /glade/u/apps/opt/rocm/rocm-6.4.3
    buildable: false
  rocsparse:
    externals:
    - spec: rocsparse@6.4.3
      prefix: /glade/u/apps/opt/rocm/rocm-6.4.3
    buildable: false
  rocthrust:
    externals:
    - spec: rocthrust@6.4.3
      prefix: /glade/u/apps/opt/rocm/rocm-6.4.3
    buildable: false
  roctracer-dev:
    externals:
    - spec: roctracer-dev@6.4.3
      prefix: /glade/u/apps/opt/rocm/rocm-6.4.3
    buildable: false
modules:
  default:
    lmod:
      projections:
        rocm-core: rocm/{version}
      rocm-core:
        template: ncar_wrapper_hip.lua
        environment:
          set:
            HSA_XNACK: '1'
            NCAR_INC_HIPRAND2: '{prefix.include}/hiprand'
          append_path:
            CMAKE_PREFIX_PATH: '{prefix}/llvm'
            LD_LIBRARY_PATH: '{prefix}/llvm/lib'
            PATH: '{prefix}/llvm/bin'

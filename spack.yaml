      # TODO - recheck whether this is a problem now
      - '@:2'
    json-c:
      require: '%gcc'
    jsoncpp:
      require: '%gcc'
    julia:
      require:
      - '%gcc'
      externals:
      - spec: julia@1.10.5
        prefix: /glade/u/apps/opt/julia/1.10.5
      - spec: julia@1.11.2
        prefix: /glade/u/apps/opt/julia/1.11.2

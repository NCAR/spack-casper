    hypre:
      require:
      - one_of:
        # This should force packages to use the vendor-preferred solution
        - '%oneapi ^intel-oneapi-mkl'
        - '%gcc ^openblas'
        - '%nvhpc ^nvhpc'
        - '%cce ^cray-libsci'
    icu4c:
      require: '%gcc'
    idl:
      require: '%gcc'
      externals:
      - spec: idl@9.0.0
        prefix: /glade/u/apps/opt/idl/9.0.0
      - spec: idl@9.1.0
        prefix: /glade/u/apps/opt/idl/9.1.0

# *** Casper OpenSUSE Software Stack ***
spack:
  config:
    install_tree:
      projections:
        ^c: '{name}/{version}/{compiler.name}/{compiler.version}/{hash:4}'
        ^cxx: '{name}/{version}/{compiler.name}/{compiler.version}/{hash:4}'
        ^fortran: '{name}/{version}/{compiler.name}/{compiler.version}/{hash:4}'
        ^mpi: '{name}/{version}/{^mpi.name}/{^mpi.version}/{compiler.name}/{compiler.version}/{hash:4}'
        all: '{name}/{version}/{hash:4}'
        c: '{name}/{version}/{hash:4}'
        netcdf-c: netcdf/{version}/packages/{name}/{version}/{compiler.name}/{compiler.version}/{hash:4}
        netcdf-c^mpi: netcdf/{version}/packages/{name}/{version}/{^mpi.name}/{^mpi.version}/{compiler.name}/{compiler.version}/{hash:4}
        netcdf-cxx4: netcdf/{^netcdf-c.version}/packages/{name}/{version}/{compiler.name}/{compiler.version}/{hash:4}
        netcdf-cxx4^mpi: netcdf/{^netcdf-c.version}/packages/{name}/{version}/{^mpi.name}/{^mpi.version}/{compiler.name}/{compiler.version}/{hash:4}
        netcdf-fortran: netcdf/{^netcdf-c.version}/packages/{name}/{version}/{compiler.name}/{compiler.version}/{hash:4}
        netcdf-fortran^mpi: netcdf/{^netcdf-c.version}/packages/{name}/{version}/{^mpi.name}/{^mpi.version}/{compiler.name}/{compiler.version}/{hash:4}
    build_jobs: 4
    test_stage: /glade/derecho/scratch/$user/temp/spack/casper/25.10/tests
    source_cache: /glade/derecho/scratch/$user/temp/spack/cache
    misc_cache: /glade/derecho/scratch/$user/temp/spack/casper/25.10/misc
    build_stage:
    - /glade/derecho/scratch/$user/temp/spack/casper/25.10/builds
    shared_linking:
    # Turning bind setting on would be beneficial but vendor compilers do not
    # seem to work with it! Avoid!
      type: rpath
      bind: false
    template_dirs:
    - /glade/u/apps/casper/25.10/envs/build/templates/modules
  env_vars:
    set:
      NVCCFLAGS: -allow-unsupported-compiler
      NVCC_PREPEND_FLAGS: -allow-unsupported-compiler
  packages:
    pkg-config:
      externals:
      - spec: pkg-config@0.29.2
        prefix: /usr
      buildable: false
    lustre:
      externals:
      - spec: lustre@2.15.6.1_cray_100_g2c66dd0
        prefix: /usr
      buildable: false
    gcc:
      externals:
      - spec: gcc@14.3.0 languages:='c,c++,fortran,go'
        prefix: /glade/u/apps/common/25.10/spack/opt/spack/gcc/14.3.0/nw2m
        extra_attributes:
          compilers:
            c: /glade/u/apps/common/25.10/spack/opt/spack/gcc/14.3.0/nw2m/bin/gcc
            cxx: /glade/u/apps/common/25.10/spack/opt/spack/gcc/14.3.0/nw2m/bin/g++
            fortran: /glade/u/apps/common/25.10/spack/opt/spack/gcc/14.3.0/nw2m/bin/gfortran
      - spec: gcc@12.5.0 languages:='c,c++,fortran,go'
        prefix: /glade/u/apps/common/25.10/spack/opt/spack/gcc/12.5.0/hsbg
        extra_attributes:
          compilers:
            c: /glade/u/apps/common/25.10/spack/opt/spack/gcc/12.5.0/hsbg/bin/gcc
            cxx: /glade/u/apps/common/25.10/spack/opt/spack/gcc/12.5.0/hsbg/bin/g++
            fortran: /glade/u/apps/common/25.10/spack/opt/spack/gcc/12.5.0/hsbg/bin/gfortran
      - spec: gcc@7.5.0 languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc
            cxx: /usr/bin/g++
            fortran: /usr/bin/gfortran
      buildable: false
      prefer:
      - spec: '%gcc@7.5.0'
        when: '@:12'
      - spec: '%gcc@12.5.0'
        when: '@13:'
      - spec: '%gcc-runtime@12.5.0'
        when: '@12.5.0'
      variants:
      - +piclibs
      - languages=c,c++,fortran,go
    openssl:
      externals:
      - spec: openssl@1.1.1w-fips
        prefix: /usr
      - spec: openssl@3.1.4
        prefix: /usr
      buildable: false
      require:
      - certs=system
    fortran:
      buildable: true
    go-or-gccgo-bootstrap:
      prefer:
      - go-bootstrap
    cxx:
      buildable: true
    c:
      buildable: true
      prefer:
      # Here we try to make sure llvm is least-preferred!
      - gcc
      - intel-oneapi-compilers
      - nvhpc
      - llvm
    opencl:
      buildable: true
    cuda:
      externals:
      - spec: cuda@12.9.0
        prefix: /glade/u/apps/common/25.10/spack/opt/spack/cuda/12.9.0/b74h
      buildable: false
      require:
      - +allow-unsupported-compilers
      variants:
      - +dev
    pkgconfig:
      buildable: false
      prefer:
      - pkg-config
    adios2:
      prefer:
      - +cuda
      - +hdf5
      - +libcatalyst
      - +sz
      - +zfp
      - +png
      - +bzip2
      - ~libpressio
      require:
      - +blosc2
      - +mgard
      - +python
      - spec: cuda_arch=60,70,80,89,90
        when: +cuda
    all:
      permissions:
        read: world
        write: user
      target:
      # This target is lowest-common denominator between Intel and Milans
      - x86_64_v3
      prefer:
      - +pic
      - spec: ^hdf5 %gcc@12.5.0
        when: '%gcc@12.5.0 ^hdf5'
      - spec: ^udunits %gcc@12.5.0
        when: '%gcc@12.5.0 ^udunits'
      - spec: ^openblas %gcc@12.5.0
        when: '%gcc@12.5.0 ^openblas'
      require:
      - spec: cuda_arch=60,70,80,89,90
        when: ^cuda
    antlr:

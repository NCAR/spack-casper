    libgit2:
      require:
      - '%gcc'
    libjpeg-turbo:
      require: '%gcc'
    libogg:
      require: '%gcc'
    libpciaccess:
      require:
      - '%gcc'
    libpng:
      require: '%gcc'
    libssh2:
      require:
      - '%gcc'
    libszip:
      require: '%gcc'
    libtheora:
      require: '%gcc'
    libtiff:

# *** OpenSUSE Casper Software Stack ***
spack:
  config:
    install_tree:
      projections:
        ^mpi: '{name}/{version}/{^mpi.name}/{^mpi.version}/{compiler.name}/{compiler.version}/{hash:4}'
        all: '{name}/{version}/{compiler.name}/{compiler.version}/{hash:4}'
        gcc: '{name}/{version}/{hash:4}'
        netcdf-c: netcdf/{version}/packages/{name}/{version}/{compiler.name}/{compiler.version}/{hash:4}
        netcdf-c^mpi: netcdf/{version}/packages/{name}/{version}/{^mpi.name}/{^mpi.version}/{compiler.name}/{compiler.version}/{hash:4}
        netcdf-cxx4: netcdf/{^netcdf-c.version}/packages/{name}/{version}/{compiler.name}/{compiler.version}/{hash:4}
        netcdf-cxx4^mpi: netcdf/{^netcdf-c.version}/packages/{name}/{version}/{^mpi.name}/{^mpi.version}/{compiler.name}/{compiler.version}/{hash:4}
        netcdf-fortran: netcdf/{^netcdf-c.version}/packages/{name}/{version}/{compiler.name}/{compiler.version}/{hash:4}
        netcdf-fortran^mpi: netcdf/{^netcdf-c.version}/packages/{name}/{version}/{^mpi.name}/{^mpi.version}/{compiler.name}/{compiler.version}/{hash:4}
    build_jobs: 4
    test_stage: /glade/derecho/scratch/$user/temp/spack/casper/24.12/tests
    source_cache: /glade/derecho/scratch/$user/temp/spack/cache
    misc_cache: /glade/derecho/scratch/$user/temp/spack/casper/24.12/misc
    build_stage:
    - /glade/derecho/scratch/$user/temp/spack/casper/24.12/builds
    shared_linking:
      # Turning this setting on would be beneficial but vendor compilers do not
      # seem to work with it! Avoid!
      type: rpath
      bind: false
    template_dirs:
    - /glade/u/apps/casper/24.12/envs/build/templates/modules
  packages:
    lustre:
      externals:
      - spec: lustre@2.15.4.2_cray_42_ga614b9c
        prefix: /usr
      buildable: false
      require:
      - '%gcc'
    pkg-config:
      externals:
      - spec: pkg-config@0.29.2
        prefix: /usr
      buildable: false
      require:
      - '%gcc'
    openssl:
      externals:
      - spec: openssl@1.1.1l
        prefix: /usr
      buildable: false
      require:
      # Requiring certs=system is necessary to perform builds like rust using
      # external openssl. Also note that I've edited the package to remove the
      # deprecation status of this version. It makes the concretizer wildly
      # unpredictable and fussy! This seems justified as the Spack documentation
      # itself suggests that the trusted thing to do is to use the system version
      - certs=system
      - '%gcc'
    gcc:
      externals:
      - spec: gcc@7.5.0 languages='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc
            cxx: /usr/bin/g++
            fortran: /usr/bin/gfortran
      variants:
      - +piclibs
      - languages=c,c++,fortran,go
      require:
      - '%gcc'
    pkgconfig:
      buildable: false
    glibc:
      require:
      - '%gcc'
    adios2:
      variants:
      - +cuda
      - +hdf5
      - +python
    all:
      compiler:
      - gcc@12.4.0
      - gcc
      - nvhpc
      - oneapi
      providers:
        'mpi:':
        - openmpi
        - impi
        - mvapich2
        'szip:':
        - libszip
        'pkgconfig:':
        - pkg-config
        'lapack:':
        - openblas
        - intel-oneapi-mkl
        - nvhpc
        'blas:':
        - openblas
        - intel-oneapi-mkl
        - nvhpc
        rpc:
        - libtirpc
        'zlib-api:':
        - zlib
        tbb:
        - intel-oneapi-tbb
        libglx:
        - opengl
        - mesa
      permissions:
        read: world
        write: user
      target:
        # This target is lowest-common denominator between Intel and Milans
      - x86_64_v3
      prefer:
        # This should force packages to use the vendor-preferred solution
        # for BLAS and LAPACK without needing to set it on each package
      - spec: ^openblas
        when: '%gcc ^lapack'
      - spec: ^intel-oneapi-mkl
        when: '%oneapi ^lapack'
      - spec: ^nvhpc@24.11
        when: '%nvhpc@24.11 ^lapack'
      - spec: ^nvhpc@25.1
        when: '%nvhpc@25.1 ^lapack'
      - spec: ^nvhpc@25.5
        when: '%nvhpc@25.5 ^lapack'
      - spec: ^openblas
        when: '%gcc ^blas'
      - spec: ^intel-oneapi-mkl
        when: '%oneapi ^blas'
      - spec: ^nvhpc
        when: '%nvhpc ^blas'
      - spec: ^pkg-config
        when: ^pkgconfig
      - spec: ^zlib
        when: ^zlib-api
      - spec: cuda_arch=60,70,80,89,90 ^cuda@12.3.2
        when: ^cuda
      # Without these, these packages will use GCC versions
      # (not yet true for nvhpc/cce, but check when those runtimes are added)
      - spec: ^hdf5 %oneapi
        when: '%oneapi ^hdf5'
      - spec: ^netcdf-c %oneapi
        when: '%oneapi ^netcdf-c'
    antlr:
      require: '%gcc'
    apptainer:
      variants:
      - ~suid
    arpack-ng:
      variants:
      - ~mpi
    attr:
      require:
      - '%gcc'
    autoconf:
      require: '%gcc'
    autoconf-archive:
      require: '%gcc'
    automake:
      require: '%gcc'
    bash:
      require:
      - '%gcc'
    binutils:
      variants:
      - +gas
      - +gold
      - +ld
      - +libiberty
    bison:
      require: '%gcc'
    bzip2:
      require:
      - '%gcc'
    c-blosc:
      require:
      - '%gcc'
    c-blosc2:
      require:
      - '%gcc'
    cairo:
      require: '%gcc'
      variants:
      - +X
      - +fc
      - +ft
      - +gobject
      - +pdf
      - +png
    cdo:
      variants:
      - +curl
      require:
      - one_of:
        - ^proj@9

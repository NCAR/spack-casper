    charliecloud:
      variants:
      - +squashfuse
    cli11:
      require: '%gcc'
    cmake:
      require:
      - '%gcc'
      # Without +ownlibs, some packages can't concretize due to infinite regression
      variants:
      - +ownlibs
    cpio:
      require:
      - '%gcc'
    cuda:
      variants:
      - +dev
      require:
      - +allow-unsupported-compilers
      - '%gcc'
    cudnn:
      require: '%gcc'
      prefer:
      - spec: ^cuda@12.3.2
    curl:
      require:
      - '%gcc'
      variants:
      - +libidn2
      - +libssh2
      - +nghttp2
    cutensor:
      require: '%gcc'
    darshan-runtime:
      variants:
      - +parallel-netcdf
      - scheduler=pbs
      require:
      - any_of:
        - ^hdf5+mpi
        when: +hdf5
    darshan-util:
      variants:
      - +bzip2
    diffutils:
      require:
      - '%gcc'
    doxygen:
      require:
      - '%gcc'
      variants:
      - +graphviz
    dsfmt:
      require:
      - '%gcc'
    ecbuild:
      require:
      - '%gcc'
    eccodes:
      variants:
      - +fortran
      - +netcdf
      - +png
      - +tools
      - jp2k=jasper
    ecflow:
      variants:
      - +ui
    eigen:
      require: '%gcc'
    emacs:
      variants:
      - +X
      - +json
      - +treesitter
    esmf:
      variants:
      - ~mpi
      - ~pnetcdf
      - ~xerces
      require:
      # Apparent prefer is not strong enough to convince Spack to use nvhpc for an
      # external-lapack. Unbelievable!
      - +external-lapack
      - +external-parallelio
      - spec: ^openblas
        when: '%gcc ^lapack'
      - spec: ^intel-oneapi-mkl
        when: '%oneapi ^lapack'
      - spec: ^nvhpc@24.11
        when: '%nvhpc@24.11 ^lapack'
      - spec: ^nvhpc@25.1
        when: '%nvhpc@25.1 ^lapack'
      - spec: ^nvhpc@25.5
        when: '%nvhpc@25.5 ^lapack'
      - spec: ^cray-libsci
        when: '%cce ^lapack'
      prefer:
      - spec: +pnetcdf
        when: +mpi
      - spec: ~pnetcdf
        when: ~mpi
    expat:
      require: '%gcc'
    ferret:
      variants:
      - +datasets
    ffmpeg:
      variants:
      - +X
      - +drawtext
      - +libaom
      - +libmp3lame
      - +libopenjpeg
      - +libopus
      - +libsnappy
      - +libspeex
      - +libssh
      - +libvorbis
      - +libvpx
      - +libwebp
      - +libx264
      - +libxml2
      - +libzmq
      - +lzma
      - +sdl2
    fftw:
      variants:
      - ~mpi
    findutils:
      require:
      - '%gcc'
    flex:
      require: '%gcc'
    fltk:
      require: '%gcc'
    fontconfig:
      require: '%gcc'
    freetype:
      require:
      # Newer version leads to concretization issues for Python packages
      # This setting avoids multiple builds of many packages
      - '@:2.10.2'
      - '%gcc'
    gawk:
      require:
      - '%gcc'
    gdal:
      require:
      - any_of:
        - ^hdf5~mpi
        when: +hdf5
      - one_of:
        - ^proj@9
        when: '@3:'
      variants:
      - +blosc
      - +curl
      - +deflate
      - +expat
      - +geos
      - +gif
      - +grass
      - +grib
      - +hdf5
      - +iconv
      - +jasper
      - +jpeg
      - +libcsf
      - +liblzma
      - +lz4
      - +netcdf
      - +pcidsk
      - +png
      - +qhull
      - +sqlite3
      - +zstd
    gdb:
      variants:
      - +gold
      - +ld
      - +lto
      - +tui
      - ~debuginfod
      - ~python
    ghostscript:
      require:
      - '%gcc'
    giflib:
      require: '%gcc'
    gimp:
      variants:
      - ~doc
    git:
      variants:
      - +svn
      - +tcltk
    gl2ps:
      require:
      - '%gcc'
    glew:

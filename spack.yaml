  modules:
    'default:':
      roots:
        lmod: /glade/u/apps/casper/modules/25.10
      arch_folder: false
      prefix_inspections:
        bin:
        - PATH
        lib:
        - NCAR_LDFLAGS_{name}
        lib64:
        - NCAR_LDFLAGS_{name}64
        include:
        - NCAR_INC_{name}
        man:
        - MANPATH
        share/man:
        - MANPATH
        lib/pkgconfig:
        - PKG_CONFIG_PATH
        lib64/pkgconfig:
        - PKG_CONFIG_PATH
      lmod:
        adios2:
          environment:
            set:
              ADIOS2: '{prefix}'
        all:
          environment:
            set:
              NCAR_ROOT_{name}: '{prefix}'
              NCAR_SPACK_HASH_{name}: '{hash}'
          template: ncar_default.lua
        apptainer:
          environment:
            prepend_path:
              PATH: '{^squashfs.prefix}/bin'
          filter:
            exclude_env_vars:
            - GOPATH
        cdo:
          autoload: none
        charliecloud:
          environment:
            prepend_path:
              PATH: /glade/u/apps/casper/25.10/opt/wrappers/{name}/{version}/{hash:4}/bin

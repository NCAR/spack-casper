# *** SLES Casper AMD Software Stack ***
spack:
  config:
    install_tree:
      projections:
        ^c: '{name}/{version}/{compiler.name}/{compiler.version}/{hash:4}'
        ^cxx: '{name}/{version}/{compiler.name}/{compiler.version}/{hash:4}'
        ^fortran: '{name}/{version}/{compiler.name}/{compiler.version}/{hash:4}'
        ^mpi: '{name}/{version}/{^mpi.name}/{^mpi.version}/{compiler.name}/{compiler.version}/{hash:4}'
        c: '{name}/{version}/{hash:4}'
        all: '{name}/{version}/{hash:4}'
        netcdf-c: netcdf/{version}/packages/{name}/{version}/{compiler.name}/{compiler.version}/{hash:4}
        netcdf-c^mpi: netcdf/{version}/packages/{name}/{version}/{^mpi.name}/{^mpi.version}/{compiler.name}/{compiler.version}/{hash:4}
        netcdf-cxx4: netcdf/{^netcdf-c.version}/packages/{name}/{version}/{compiler.name}/{compiler.version}/{hash:4}
        netcdf-cxx4^mpi: netcdf/{^netcdf-c.version}/packages/{name}/{version}/{^mpi.name}/{^mpi.version}/{compiler.name}/{compiler.version}/{hash:4}
        netcdf-fortran: netcdf/{^netcdf-c.version}/packages/{name}/{version}/{compiler.name}/{compiler.version}/{hash:4}
        netcdf-fortran^mpi: netcdf/{^netcdf-c.version}/packages/{name}/{version}/{^mpi.name}/{^mpi.version}/{compiler.name}/{compiler.version}/{hash:4}
        nvhpc: '{name}/{version}/{hash:4}'
    build_jobs: 4
    test_stage: /glade/derecho/scratch/$user/temp/spack/casper/25.08-rocm/tests
    source_cache: /glade/derecho/scratch/$user/temp/spack/cache
    misc_cache: /glade/derecho/scratch/$user/temp/spack/casper/25.08-rocm/misc
    build_stage:
    - /glade/derecho/scratch/$user/temp/spack/casper/25.08-rocm/builds
    shared_linking:
    # Turning bind setting on would be beneficial but vendor compilers do not
    # seem to work with it! Avoid!
      type: rpath
      bind: false
    template_dirs:
    - /glade/u/apps/casper/25.08-rocm/envs/build/templates/modules
  packages:
    openssl:
      externals:
      - spec: openssl@1.1.1l
        prefix: /usr
      buildable: false
      require:
      - certs=system
    pkg-config:
      externals:
      - spec: pkg-config@0.29.2
        prefix: /usr
      buildable: false
    lustre:
      externals:
      - spec: lustre@2.15.4.2_cray_42_ga614b9c
        prefix: /usr
      buildable: false
    gcc:
      externals:
      - spec: gcc@7.5.0 languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc
            cxx: /usr/bin/g++
            fortran: /usr/bin/gfortran
      variants:
      - +piclibs
      - languages=c,c++,fortran
      prefer:
      - spec: '%gcc@7.5.0'
        when: '@:12'
      - spec: '%gcc@12.5.0'
        when: '@13:'
    pkgconfig:
      buildable: false
      prefer:
      - pkg-config
    adios2:
      variants:
      - +hdf5
      - +python
      - +rocm
    all:
      permissions:
        read: world
        write: user
      target:
      # This target is lowest-common denominator between Intel and Milans
      - x86_64_v3
      prefer:
      - +pic
      - +rocm
      - '%c,cxx=gcc@12.5.0'
      - amdgpu_target=gfx942
      - spec: ^hdf5 %gcc@12.5.0
        when: '%gcc@12.5.0 ^hdf5'
      - spec: ^udunits %gcc@12.5.0
        when: '%gcc@12.5.0 ^udunits'
      - spec: ^openblas %gcc@12.5.0
        when: '%gcc@12.5.0 ^openblas'
      - spec: ^openblas %gcc@13.4.0
        when: '%gcc@13.4.0 ^openblas'
      - spec: ^openblas %gcc@15.1.0
        when: '%gcc@15.1.0 ^openblas'
    amdblis:
      variants:
      - +aocl_gemm
      - threads=openmp
      require:
      - '%aocc'
    amdlibflame:
      require:
      - '%aocc'
      - '%blas=amdblis'
      variants:
      - threads=openmp
    aocc:
      require:
      - +license-agreed
    aocl-utils:
      require:
      - '%aocc'
    arpack-ng:
      variants:
      - ~mpi
    automake:
      prefer:
      - '%gcc@12.5.0'
    berkeley-db:
      prefer:
      - '%gcc@12.5.0'
    bzip2:
      prefer:
      - '%gcc@12.5.0'
    cairo:
      variants:
      - +X
      - +fc
      - +ft
      - +gobject
      - +pdf
      - +png
      - +svg
      - +zlib
      prefer:
      - '%gcc@12.5.0'
      # Spack uses older version to avoid pixman :(
      - '@1.18:'
    cdo:
      prefer:
      - +curl
      - +netcdf
      - +hdf5
      - +fftw3
      - +libxml2
      - +udunits2
      - '%gcc@12.5.0'
    cmake:
      variants:
      - +ownlibs
      prefer:
      - '%gcc@12.5.0'
    cmor:
      prefer:
      - ^udunits %gcc@12.5.0
      - '%gcc@12.5.0'
    comgr:
      prefer:
      - '%gcc@12.5.0'
    cp2k:
      variants:
      - +elpa
      - +libvori
      - +plumed
      - +spglib
    curl:
      variants:
      - +libidn2
      - +libssh
      - +libssh2
      - +nghttp2
      prefer:
      - tls=openssl
      - '%gcc@12.5.0'
    darshan-runtime:
      variants:
      - +parallel-netcdf
      - scheduler=pbs
      require:
      - spec: ^hdf5+mpi
        when: +hdf5
      prefer:
      - spec: cflags='-std=gnu17 -Wno-error=implicit-function-declaration -Wno-error=int-conversion'
        when: '%gcc@15:'
    darshan-util:
      variants:
      - +bzip2
      prefer:
      - '%gcc@12.5.0'
    diffutils:
      prefer:
      - '%gcc@12.5.0'
    doxygen:
      variants:
      - +graphviz
    eccodes:
      variants:
      - +fortran
      - +png
      - +tools
      - jp2k=jasper
      require:
      - +netcdf
    ecflow:
      require:
      - +pic
      - +ui
      prefer:
      - '%gcc@12.5.0'
    emacs:
      variants:
      - +X
      - +json
      - +treesitter
      prefer:
      - gui=x11
      - '%gcc@12.5.0'
    esmf:
      variants:
      - ~mpi
      - ~xerces
      require:
      - +external-lapack
      - +external-parallelio
      - +netcdf
      - one_of:
        - +pnetcdf +mpi
        - ~pnetcdf ~mpi
    ffmpeg:
      variants:
      - +X
      - +drawtext
      - +libaom
      - +libmp3lame
      - +libopenjpeg
      - +libopus
      - +libsnappy
      - +libspeex
      - +libssh
      - +libvorbis
      - +libvpx
      - +libwebp
      - +libx264
      - +libxml2
      - +libzma
      - +libzmq
      - +sdl2
    fftw:
      variants:
      - ~mpi
    findutils:
      prefer:
      - '%gcc@12.5.0'
    flex:
      prefer:
      - '@2.6.4'
      - '%gcc@12.5.0'
    fmt:
      prefer:
      - '%gcc@12.5.0'
    gawk:
      prefer:
      - '%gcc@12.5.0'
    gdal:
      require:
      - spec: ^hdf5~mpi
        when: +hdf5
      # libcsf, pcidsk, pdfium can't actually be used... why are they variants???
      # Need to specify these as requirements b/c Spack will be lazy and avoid even
      # with prefer
      - +blosc
      - +curl
      - +deflate
      - +expat
      - +geos
      - +gif
      - +hdf5
      - +iconv
      - +jpeg
      - +libaec
      - +liblzma
      - +libxml2
      - +lz4
      - +netcdf
      - +openjpeg
      - +parquet
      - +png
      - +qhull
      - +sqlite3
      - +webp
      - +zstd
      - ~hdf4
    gdb:
      variants:
      - +gold
      - +ld
      - +lto
      - +source-highlight
      - +tui
      - ~debuginfod
      - ~python
      prefer:
      - '%gcc@12.5.0'
    gdbm:
      prefer:
      - '%gcc@12.5.0'
    gettext:
      prefer:
      - +libxml2
      - '%gcc@12.5.0'
    git:
      variants:
      - +svn
      - +tcltk
      prefer:
      - '%gcc@12.5.0'
    gmake:
      variants:
      - ~guile
      require:
      # This may help ioapi build
      - '@:4.2'
      prefer:
      - '%gcc@12.5.0'
    gmp:
      prefer:
      - '%gcc@12.5.0'
    gmt:
      variants:
      - +ffmpeg
      - +fftw
      - +geos
      - +ghostscript
      - +glib
      - +pcre
      require:
      - +blas
      - +lapack
      - spec: '^ffmpeg@7:'
        when: +ffmpeg
      prefer:
      - '%gcc@12.5.0'
    gnuplot:
      variants:
      - +X
      - +wx
      prefer:
      - +qt
      - '%gcc@12.5.0'
    gptl:
      variants:
      - +nestedomp
      - +papi
      - +pmpi
      prefer:
      - spec: cflags='-std=gnu17 -Wno-error=implicit-function-declaration -Wno-error=int-conversion'
        when: '%gcc@15:'
    grads:
      require:
      - +dap
      - +hdf4
    h5z-ftp:
      require:
      - ^hdf5~mpi
    harfbuzz:
      variants:
      - +graphite2
      prefer:
      - '%gcc@12.5.0'
    hdf:
      variants:
      - +fortran
      - +szip
      require:
      - +external-xdr
      prefer:
      - spec: cflags='-std=c90 -Wno-error=int-conversion'
        when: '%gcc@15:'
      - spec: cflags='-std=c90 -Wno-error=int-conversion'
        when: '%intel-oneapi-compilers'
    hdf5:
      variants:
      - +cxx
      - +fortran
      - +hl
      - +map
      - +szip
      - ~mpi
      require:
      - spec: ldflags=-lpthread
        when: +threadsafe @1.14
    hip:
      require:
      - +rocm
      prefer:
      - '%gcc@12.5.0'
    hipcc:
      prefer:
      - '%gcc@12.5.0'
    hwloc:
      require:
      - +rocm
      - amdgpu_target=gfx942
      prefer:
      - '%gcc@12.5.0'
    imagemagick:
      variants:
      - +ghostscript
    intel-oneapi-compilers:
      variants:
      - +amd
      prefer:
      - '%gcc@12.5.0'
    intel-oneapi-mkl:
      require:
      - spec: +gfortran threads=openmp
        when: '%gcc'
    intel-oneapi-mpi:
      variants:
      - +external-libfabric
      - +generic-names
    intel-oneapi-runtime:
      prefer:
      - ^gcc-runtime@12.5.0
    ip:
      prefer:
      - '%lapack=openblas'
    ispc:
      require:
      - '%clang'
    jasper:
      prefer:
      - '@:2'
      - '%gcc@12.5.0'
    kokkos:
      variants:
      - +examples
      - ~openmp
      require:
      - spec: +rocm +wrapper ~alloc_async
        when: '%gcc'
      - spec: +rocm +apu +wrapper ~alloc_async
        when: '%aocc'
      - spec: ^cmake@3.27
        when: '@:4.2.01 +rocm'
    libarchive:
      require:
      - compression=bz2lib,lz4,lzma,lzo2,zlib,zstd xar=expat
    libdrm:
      prefer:
      - '@2.4.124'
      - '%gcc@12.5.0'
    libgeotiff:
      require:
      # Doesn't build without proj as a dependency for me
      - +proj
      prefer:
      - '%gcc@12.5.0'
    libglx:
      prefer:
      - opengl
    libsigsegv:
      prefer:
      - '%gcc@12.5.0'
    libszip:
      prefer:
      - '%gcc@12.5.0'
    libtiff:
      require:
      - build_system=cmake
      - +pic
      prefer:
      - '%gcc@12.5.0'
    libtool:
      prefer:
      - '%gcc@12.5.0'
    libtree:
      prefer:
      - '%gcc@12.5.0'
    libunwind:
      variants:
      - +cxx_exceptions
      - +debug_frame
      - +xz
      - +zlib
      - components=setjmp,ptrace,coredump
    libzip:
      prefer:
      - +gnutls
      - '%gcc@12.5.0'
    linaro-forge:
      require:
      - +accept-eula
    llvm-amdgpu:
      require:
      - '%gcc@12.5.0'
    m4:
      prefer:
      - '%gcc@12.5.0'
    mesa:
      require:
      - +llvm
      - '@25:'
      prefer:
      - ^llvm ~clang
    met:
      variants:
      - +graphics
      - +grib2
      - +lidar2nc
      - +modis
      - +python
    metplus:
      variants:
      - +cycloneplotter
      - +makeplots
      - +plotdataplane
      - +series_analysis
    mpc:
      prefer:
      - '%gcc@12.5.0'
    mpfr:
      prefer:
      - '%gcc@12.5.0'
    mpi:
      prefer:
      - openmpi
    mpifileutils:
      variants:
      - +gpfs
      - +lustre
      - +xattr
    musica:
      variants:
      - ~tuvx
    ncarcompilers:
      variants:
      - +hip
    ncl:
      variants:
      - +eemd
      - +gdal
      - +grib
      - +hdf-eos2
      - +hdf-eos5
      - +hdf4
      externals:
      - spec: ncl@6.6.2
        prefix: /glade/u/apps/opt/ncl/6.6.2
      buildable: false
    nco:
      prefer:
      - ^udunits %gcc@12.5.0
      - '%gcc@12.5.0'
    ncurses:
      prefer:
      - '%gcc@12.5.0'
    ncview:
      prefer:
      - ^udunits %gcc@12.5.0
      - '%gcc@12.5.0'
    ncvis:
      require:
      - ^netcdf-c build_system=autotools
      prefer:
      - '%gcc@12.5.0'
    netcdf:
      variants:
      - +dap
      - ~mpi
    netcdf-c:
      variants:
      - ~mpi
      prefer:
      # Would do require, but ncvis barfs
      - build_system=cmake
      - +blosc
      require:
      - +dap
      - +nczarr_zip
    nettle:
      require:
      - ^gmp %gcc@12.5.0
    numactl:
      require:
      - '%gcc@12.5.0'
    nvhpc:
      require:
      - +blas
      - +lapack
      - ~mpi
      prefer:
      - '%gcc@12.5.0'
    nvtop:
      require:
      - support:=amd
    octave:
      variants:
      - +arpack
      - +curl
      - +fftw
      - +fltk
      - +fontconfig
      - +freetype
      - +gl2ps
      - +glpk
      - +gnuplot
      - +hdf5
      - +llvm
      - +magick
      - +opengl
      - +qhull
      - +qrupdate
      - +qscintilla
      - +qt
      - +suitesparse
      - +zlib
    openblas:
      variants:
      - +fortran
      - threads=openmp
    opengl:
      externals:
      - spec: opengl@4.5
        prefix: /usr
      buildable: false
    openmpi:
      require:
      - fabrics=cma,ucx
      - schedulers=tm
      - +gpfs
      - +lustre
      - +internal-pmix
      - +romio
      - romio-filesystem=nfs,gpfs,lustre,ufs
      - +fortran
      - +rocm
      - amdgpu_target=gfx942
      - spec: ldflags=-ldl
        when: '%aocc'
      prefer:
      # Otherwise concretizer will try to use old versions
      - spec: ^ucx@1.19.0
        when: '@5.0.8'
    openpbs:
      externals:
      - spec: openpbs@2021.1.3
        prefix: /opt/pbs
      buildable: false
    osu-micro-benchmarks:
      variants:
      - +rocm
    pandoc:
      require:
      - +texlive
    pango:
      variants:
      - +X
      prefer:
      - '%gcc@12.5.0'
    parallel-netcdf:
      variants:
      - +examples
      prefer:
      - spec: cflags='-std=c17 -Wno-error=incompatible-pointer-types -Wno-error=implicit-function-declaration -Wno-error=int-conversion'
        when: '%gcc@15:'
    parallelio:
      variants:
      - +ncint
      - ~logging
      require:
      - +fortran
      - spec: ~pnetcdf
        when: ~mpi
      - spec: +pnetcdf
        when: +mpi
    parallelio1:
      require:
      - +pnetcdf
    perl:
      prefer:
      - '%gcc@12.5.0'
    postgresql:
      require:
      - +icu
      - +xml
      prefer:
      - '%gcc@12.5.0'
    py-beautifulsoup4:
      prefer:
      - '@4.12:'
    py-netcdf4:
      variants:
      - ~mpi
    py-numpy:
      require:
      - '%blas=openblas'
    python:
      require:
      - +ssl
      - '@3.11'
      - '%gcc@12.5.0'
      prefer:
      - +pyexpat
      - +uuid
      - '%gcc@12.5.0'
    qt:
      variants:
      - +dbus
      - +examples
      - +opengl
      - +webkit
      require:
      - +gtk
      - +gui
      - +ssl
      - '@5.14.2'
      prefer:
      - '%gcc@12.5.0'
    rccl:
      require:
      - amdgpu_target=gfx942
    readline:
      prefer:
      - '%gcc@12.5.0'
    rocblas:
      prefer:
      - +tensile
      - amdgpu_target=gfx942
    rocfft:
      prefer:
      - amdgpu_target=gfx942
      - amdgpu_target_sram_ecc=gfx942
    rocprofiler-systems:
      require:
      - ~internal-dyninst
      - +rocm
      - +perfetto_tools
      - +python
    singularityce:
      variants:
      - ~suid
    snappy:
      require:
      # Required for arrow, which is needed for parquet support in GDAL
      - ~shared
    superlu:
      require:
      - +fortran
    superlu-dist:
      variants:
      - +openmp
      prefer:
      - spec: cflags='-std=gnu17 -Wno-error=implicit-function-declaration -Wno-error=int-conversion'
        when: '%gcc@15:'
      - spec: ^openblas %gcc@13.4.0
        when: '%gcc@13.4.0 ^openblas'
    szip:
      prefer:
      - libszip
    tbb:
      prefer:
      - intel-oneapi-tbb
    texinfo:
      prefer:
      - '%gcc@12.5.0'
    tree:
      prefer:
      - '%gcc@12.5.0'
    ucx:
      variants:
      - +cm
      - +cma
      - +dc
      - +dm
      - +ib_hw_tm
      - +mlx5_dv
      - +rc
      - +rdmacm
      - +thread_multiple
      - +ud
      - +verbs
      - +vfs
      - ~knem
      require:
      - +rocm
      - ^hsa-rocr-dev@6.3.3
      prefer:
      - '%gcc@12.5.0'
    uuid:
      prefer:
      - util-linux-uuid
    vim:
      variants:
      - +cscope
      - +lua
      - +perl
      - +python
      - +ruby
      - +x
      - features=huge
      require:
      - +gtk
      - +gui
      prefer:
      - '%gcc@12.5.0'
    wget:
      prefer:
      - ssl=openssl
    wgrib2:
      variants:
      - +ipolates
      - +netcdf
      - +proj4
      - +udf
      - ~netcdf3
      prefer:
      - '%gcc@12.5.0'
    wxwidgets:
      variants:
      - +opengl
    xkbdata-api:
      prefer:
      - xkbdata
    xnedit:
      require:
      # Wont build without this, actually!
      - +motif
      prefer:
      - '%gcc@12.5.0'
    zfp:
      variants:
      - +tight-error
      - round=first
    zlib:
      prefer:
      - '%gcc@12.5.0'
    zlib-api:
      prefer:
      - zlib-ng
    zlib-ng:
      require:
      - +compat
      - +new_strategies
      - +shared
      prefer:
      - '%gcc@12.5.0'
    zstd:
      variants:
      - +programs
      prefer:
      - '%gcc@12.5.0'
      - compression=lz4,lzma,zlib
    antlr:
      prefer:
      - '%gcc@12.5.0'
    apptainer:
      prefer:
      - '%gcc@12.5.0'
    arrow:
      prefer:
      - '%gcc@12.5.0'
    assimp:
      prefer:
      - '%gcc@12.5.0'
    bash:
      prefer:
      - '%gcc@12.5.0'
    bison:
      prefer:
      - '%gcc@12.5.0'
    c-blosc:
      prefer:
      - '%gcc@12.5.0'
    charliecloud:
      prefer:
      - '%gcc@12.5.0'
    dbus:
      prefer:
      - '%gcc@12.5.0'
    eigen:
      prefer:
      - '%gcc@12.5.0'
    expat:
      prefer:
      - '%gcc@12.5.0'
    flatbuffers:
      prefer:
      - '%gcc@12.5.0'
    gnutls:
      prefer:
      - '%gcc@12.5.0'
    go:
      prefer:
      - '%gcc@12.5.0'
    googletest:
      prefer:
      - '%gcc@12.5.0'
    graphite2:
      prefer:
      - '%gcc@12.5.0'
    grep:
      prefer:
      - '%gcc@12.5.0'
    grib-util:
      prefer:
      - '%gcc@12.5.0'
    gtkplus:
      prefer:
      - '%gcc@12.5.0'
    gzip:
      prefer:
      - '%gcc@12.5.0'
    heaptrack:
      prefer:
      - '%gcc@12.5.0'
    help2man:
      prefer:
      - '%gcc@12.5.0'
    intel-oneapi-advisor:
      prefer:

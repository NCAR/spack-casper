    imagemagick:
      variants:
      - +ghostscript
    intel-oneapi-advisor:
      require:
      - '%gcc'
    intel-oneapi-compilers:
      require: '%gcc'
      variants:
      - +nvidia
    intel-oneapi-inspector:
      require:
      - '%gcc'
    intel-oneapi-mkl:
      require:
      - spec: '@2024'
        when: '%oneapi@2024'
      - spec: '@2025.0'
        when: '%oneapi@2025.0'
      - spec: '@2025.1'
        when: '%oneapi@2025.1'
      - spec: +gfortran threads=openmp
